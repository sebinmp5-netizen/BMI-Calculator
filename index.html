<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer"></head>
<body>
    <div class="container card shadow">
        <!-- heading -->
        <div class="text-center mt-5 d-flex justify-content-center">
            <div><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRNuJqGyIGzds-ySPG7P2PtFXyEWtCX8vCpvQCsrd22fw&s=10" class="img-fluid" height="60" width="60" alt=""></div>
            <div class="ms-3">
                <h1>BMI Calculator</h1>
                <p>Check your body mass index</p>
            </div>
        </div>
        <!-- form -->
        <form id="userForm">
            <div class="row g-4 mt-3">
                <div class="col-md-3"></div>
                <div class="col-md-3">
                    <h6 class="text-center"><i class="fa-solid fa-person"></i>Gender</h6>
                    <div class="d-flex justify-content-center flex-wrap gap-3">
                        <div>
                            <input type="radio" name="gender" id="male">
                            <label for="male">male</label>
                        </div>
                        <div>
                            <input type="radio" name="gender" id="female">
                            <label for="">female</label>
                        </div>
                        <div>
                            <input type="radio" name="gender" id="others">
                            <label for="">others</label>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <h6 class="text-center"><i class="fa-regular fa-calendar"></i>Age</h6>
                    <input id="age" type="text" placeholder="Enter your age" style="width: 75%;" class="ms-5">
                </div>
                <div class="col-md-3"></div>
                <div class="col-md-3"></div>
                <div class="col-md-3">
                    <h6 class="text-center"><i class="fa-solid fa-ruler"></i>Height (cm)</h6>
                    <input id="heightcm" type="text" placeholder="Enter height" style="width: 75%;" class="ms-5">
                </div>
                <div class="col-md-3">
                    <h6 class="text-center"><i class="fa-solid fa-weight-scale"></i>Weight (kg)</h6>
                    <input id="weightkg" type="text" placeholder="Enter Weight" style="width: 75%;" class="ms-5">
                </div>
                <div class="col-md-3"></div>
            </div>
            <div class=" d-flex justify-content-center mt-3 row">
                <div class="col-md-3"></div>
                <div class="col mt-4 ms-5 me-5">
                    <button type="submit" class="btn btn-success w-100">Calculate</button>
                </div>
                <div class="col-md-3"></div>
            </div>
        </form>
        <!-- result -->
        <div class="row m-2">
            <div class="col-md-3"></div>
            <div class="col-md-6 row p-5 rounded" id="result">
                <div class="col-md d-flex flex-column justify-content-center align-items-center" id="resultText">
                    <h1 id="bmiNum">0</h1>
                    <h3>BMI</h3>
                </div>
                <div class="row col-md justify-content-center align-items-center">
                    <button class="w-50 btn btn-primary text-white" id="btnResult">Underweight</button>
                    <p class="mt-3 text-center" id="paraResult">You are below the healthy weight range.</p>
                </div>
            </div>
            <div class="col-md-3"></div>
        </div>
        <div>
            <h5 class="text-center mt-3">BMI Category Range</h5>
            <div class="row g-3 mt-2 mb-5">
                <div class="col-md-3"></div>
                <div class="col-md">
                    <div class="bg-primary rounded p-2"></div>
                    <div class="text-center">
                        <h6>Underweight</h6>
                        <h6>(< 18.5)</h4>
                    </div>
                </div>
                <div class="col-md">
                    <div class="bg-success rounded p-2"></div>
                    <div class="text-center">
                        <h6>Normal</h6>
                        <h6>(18.5-24.9)</h4>
                    </div>
                </div>
                <div class="col-md">
                    <div class="bg-warning rounded p-2"></div>
                    <div class="text-center">
                        <h6>Overweight</h6>
                        <h6>(25-29.9)</h4>
                    </div>
                </div>
                <div class="col-md">
                    <div class="bg-danger rounded p-2"></div>
                    <div class="text-center">
                        <h6>Obese</h6>
                        <h6>(>30)</h4>
                    </div>
                </div>
                <div class="col-md-3"></div>
            </div>
        </div>
    </div>
</body>
<script src="./main.js"></script>
</html>
